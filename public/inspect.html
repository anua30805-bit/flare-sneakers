<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #000; color: white; font-family: sans-serif; padding: 20px; }
    canvas { border: 2px solid #555; margin: 10px; display: block; }
  </style>
</head>
<body>
  <h2>Inspecting Video Frames</h2>
  <video id="v" src="/videos/hero-sneaker-showcase.mp4" muted playsinline></video>
  <div id="output"></div>
  <script>
    const v = document.getElementById('v');
    const out = document.getElementById('output');
    v.onloadedmetadata = async () => {
      console.log('Video loaded:', v.videoWidth, v.videoHeight, v.duration);
      const times = [1, 3, 6, 9, 12];
      for (const t of times) {
        v.currentTime = t;
        await new Promise(r => v.onseeked = r);
        const c = document.createElement('canvas');
        c.width = v.videoWidth;
        c.height = v.videoHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(v, 0, 0, c.width, c.height);
        
        // Also save data url or download
        const p = document.createElement('p');
        p.innerText = 'Time: ' + t + 's';
        out.appendChild(p);
        out.appendChild(c);
      }
      document.title = 'READY_TO_SCREENSHOT';
    };
  </script>
</body>
</html>
